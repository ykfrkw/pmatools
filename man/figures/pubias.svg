<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 626" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="pubias-title pubias-desc">
  <title id="pubias-title">Publication bias: the Core GRADE 4 Figure 5 decision as pmatools implements it</title>
  <desc id="pubias-desc">Flowchart. Q1 asks whether most or all studies are small and industry sponsored; yes means rate down one level. Otherwise a pmatools input, drawn dashed because it is not a node of Figure 5, asks whether registry coverage is complete; yes means do not rate down, on the reviewer&#8217;s assertion alone. Otherwise Q2 asks whether statistical analysis is feasible, that is whether a meta-analysis of ten or more studies was performed. If it is, Q3 asks whether funnel plot asymmetry, visually or by Egger&#8217;s test, strongly suggests publication bias: yes rates down one level, no does not, and a test that could not be run leaves a qualitative assessment required. If statistical analysis is not feasible, Q4 asks whether unpublished studies are documented in a trial registry or FDA records: yes rates down one level, no does not, and no answer leaves a qualitative assessment required. This is pmatools&#8217; operationalisation of the Core GRADE 4 Figure 5 decision, not a reproduction of the published figure.</desc>
  <style>
    .pma-fc-node rect, .pma-fc-leaf rect {
      fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2;
    }
    .pma-fc-pmatools rect { stroke-dasharray: 5 3; }
    .pma-fc-edge path { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
    .pma-fc-node text, .pma-fc-leaf text, .pma-fc-edge text {
      fill: #475569; font-size: 13px; font-weight: 400;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
    }
    .pma-fc-edge-label { font-size: 12px; }
    .pma-fc-caption { fill: #64748b; font-size: 12px; font-style: italic;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif; }
    .pma-fc-heading { fill: #0f172a; font-size: 14px; font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif; }
    .pma-fc-on.pma-fc-node rect, .pma-fc-on.pma-fc-leaf rect {
      stroke: #0f172a; stroke-width: 2.5;
    }
    .pma-fc-on.pma-fc-edge path { stroke: #0f172a; stroke-width: 3; }
    .pma-fc-on text { fill: #0f172a; font-weight: 600; }
  </style>
  <text class="pma-fc-heading" x="20" y="26">Publication bias &#8212; Core GRADE 4 Fig 5, as pmatools implements it</text>
  <g id="pma-pubias-edge-q1-yes" class="pma-fc-edge">
    <path d="M 490 76 L 560 76"/>
    <path d="M 553 80.5 L 560 76 L 553 71.5"/>
    <text class="pma-fc-edge-label" x="525" y="69" text-anchor="middle">Yes</text>
  </g>
  <g id="pma-pubias-edge-q1-no" class="pma-fc-edge">
    <path d="M 255 104 L 255 150"/>
    <path d="M 250.5 143 L 255 150 L 259.5 143"/>
    <text class="pma-fc-edge-label" x="263" y="130" text-anchor="start">No</text>
  </g>
  <g id="pma-pubias-edge-registry-yes" class="pma-fc-edge">
    <path d="M 490 176 L 560 176"/>
    <path d="M 553 180.5 L 560 176 L 553 171.5"/>
    <text class="pma-fc-edge-label" x="525" y="169" text-anchor="middle">Yes</text>
  </g>
  <g id="pma-pubias-edge-registry-no" class="pma-fc-edge">
    <path d="M 255 223 L 255 275"/>
    <path d="M 250.5 268 L 255 275 L 259.5 268"/>
    <text class="pma-fc-edge-label" x="263" y="252" text-anchor="start">No or not answered</text>
  </g>
  <g id="pma-pubias-edge-q2-yes" class="pma-fc-edge">
    <path d="M 200 331 L 200 383"/>
    <path d="M 195.5 376 L 200 383 L 204.5 376"/>
    <text class="pma-fc-edge-label" x="208" y="360" text-anchor="start">Yes</text>
  </g>
  <g id="pma-pubias-edge-q2-no" class="pma-fc-edge">
    <path d="M 490 303 L 720 303 L 720 383"/>
    <path d="M 715.5 376 L 720 383 L 724.5 376"/>
    <text class="pma-fc-edge-label" x="500" y="295" text-anchor="start">No</text>
  </g>
  <g id="pma-pubias-edge-q3-yes" class="pma-fc-edge">
    <path d="M 90 456 L 90 500"/>
    <path d="M 85.5 493 L 90 500 L 94.5 493"/>
    <text class="pma-fc-edge-label" x="90" y="492" text-anchor="middle">Yes</text>
  </g>
  <g id="pma-pubias-edge-q3-no" class="pma-fc-edge">
    <path d="M 242 456 L 242 500"/>
    <path d="M 237.5 493 L 242 500 L 246.5 493"/>
    <text class="pma-fc-edge-label" x="242" y="492" text-anchor="middle">No</text>
  </g>
  <g id="pma-pubias-edge-q3-na" class="pma-fc-edge">
    <path d="M 392 456 L 392 500"/>
    <path d="M 387.5 493 L 392 500 L 396.5 493"/>
    <text class="pma-fc-edge-label" x="392" y="492" text-anchor="middle">Test not run</text>
  </g>
  <g id="pma-pubias-edge-q4-yes" class="pma-fc-edge">
    <path d="M 570 439 L 570 500"/>
    <path d="M 565.5 493 L 570 500 L 574.5 493"/>
    <text class="pma-fc-edge-label" x="570" y="492" text-anchor="middle">Yes</text>
  </g>
  <g id="pma-pubias-edge-q4-no" class="pma-fc-edge">
    <path d="M 722 439 L 722 500"/>
    <path d="M 717.5 493 L 722 500 L 726.5 493"/>
    <text class="pma-fc-edge-label" x="722" y="492" text-anchor="middle">No</text>
  </g>
  <g id="pma-pubias-edge-q4-na" class="pma-fc-edge">
    <path d="M 872 439 L 872 500"/>
    <path d="M 867.5 493 L 872 500 L 876.5 493"/>
    <text class="pma-fc-edge-label" x="872" y="492" text-anchor="middle">Not answered</text>
  </g>
  <g id="pma-pubias-node-q1" class="pma-fc-node">
    <rect x="20" y="48" width="470" height="56" rx="6" ry="6"/>
    <text x="255" y="71" text-anchor="middle">
      <tspan x="255" dy="0">Q1  Are most or all studies small</tspan>
      <tspan x="255" dy="17">and industry sponsored?</tspan>
    </text>
  </g>
  <g id="pma-pubias-leaf-down1-q1" class="pma-fc-leaf">
    <rect x="560" y="48" width="380" height="39" rx="6" ry="6"/>
    <text x="750" y="71" text-anchor="middle">
      <tspan x="750" dy="0">Rate down 1 level</tspan>
    </text>
  </g>
  <g id="pma-pubias-node-registry" class="pma-fc-node pma-fc-pmatools">
    <rect x="20" y="150" width="470" height="73" rx="6" ry="6"/>
    <text x="255" y="173" text-anchor="middle">
      <tspan x="255" dy="0">pmatools input, not a node of Figure 5</tspan>
      <tspan x="255" dy="17">Is registry coverage complete, so that every</tspan>
      <tspan x="255" dy="17">registered trial can be accounted for?</tspan>
    </text>
  </g>
  <g id="pma-pubias-leaf-nodown-registry" class="pma-fc-leaf">
    <rect x="560" y="148" width="380" height="56" rx="6" ry="6"/>
    <text x="750" y="171" text-anchor="middle">
      <tspan x="750" dy="0">Do not rate down</tspan>
      <tspan x="750" dy="17">On the reviewer&#8217;s assertion alone</tspan>
    </text>
  </g>
  <g id="pma-pubias-node-q2" class="pma-fc-node">
    <rect x="20" y="275" width="470" height="56" rx="6" ry="6"/>
    <text x="255" y="298" text-anchor="middle">
      <tspan x="255" dy="0">Q2  Is statistical analysis feasible?</tspan>
      <tspan x="255" dy="17">(a meta-analysis of 10 or more studies)</tspan>
    </text>
  </g>
  <g id="pma-pubias-node-q3" class="pma-fc-node">
    <rect x="20" y="383" width="440" height="73" rx="6" ry="6"/>
    <text x="240" y="406" text-anchor="middle">
      <tspan x="240" dy="0">Q3  Does funnel plot asymmetry, visually</tspan>
      <tspan x="240" dy="17">or by Egger&#8217;s test, strongly suggest</tspan>
      <tspan x="240" dy="17">publication bias?</tspan>
    </text>
  </g>
  <g id="pma-pubias-node-q4" class="pma-fc-node">
    <rect x="500" y="383" width="440" height="56" rx="6" ry="6"/>
    <text x="720" y="406" text-anchor="middle">
      <tspan x="720" dy="0">Q4  Is there documentation of unpublished</tspan>
      <tspan x="720" dy="17">studies (a trial registry, FDA records)?</tspan>
    </text>
  </g>
  <g id="pma-pubias-leaf-down1-q3" class="pma-fc-leaf">
    <rect x="20" y="500" width="140" height="56" rx="6" ry="6"/>
    <text x="90" y="523" text-anchor="middle">
      <tspan x="90" dy="0">Rate down</tspan>
      <tspan x="90" dy="17">1 level</tspan>
    </text>
  </g>
  <g id="pma-pubias-leaf-nodown-q3" class="pma-fc-leaf">
    <rect x="172" y="500" width="140" height="56" rx="6" ry="6"/>
    <text x="242" y="523" text-anchor="middle">
      <tspan x="242" dy="0">Do not</tspan>
      <tspan x="242" dy="17">rate down</tspan>
    </text>
  </g>
  <g id="pma-pubias-leaf-qual-q3" class="pma-fc-leaf">
    <rect x="324" y="500" width="136" height="73" rx="6" ry="6"/>
    <text x="392" y="523" text-anchor="middle">
      <tspan x="392" dy="0">Qualitative</tspan>
      <tspan x="392" dy="17">assessment</tspan>
      <tspan x="392" dy="17">required</tspan>
    </text>
  </g>
  <g id="pma-pubias-leaf-down1-q4" class="pma-fc-leaf">
    <rect x="500" y="500" width="140" height="56" rx="6" ry="6"/>
    <text x="570" y="523" text-anchor="middle">
      <tspan x="570" dy="0">Rate down</tspan>
      <tspan x="570" dy="17">1 level</tspan>
    </text>
  </g>
  <g id="pma-pubias-leaf-nodown-q4" class="pma-fc-leaf">
    <rect x="652" y="500" width="140" height="56" rx="6" ry="6"/>
    <text x="722" y="523" text-anchor="middle">
      <tspan x="722" dy="0">Do not</tspan>
      <tspan x="722" dy="17">rate down</tspan>
    </text>
  </g>
  <g id="pma-pubias-leaf-qual-q4" class="pma-fc-leaf">
    <rect x="804" y="500" width="136" height="73" rx="6" ry="6"/>
    <text x="872" y="523" text-anchor="middle">
      <tspan x="872" dy="0">Qualitative</tspan>
      <tspan x="872" dy="17">assessment</tspan>
      <tspan x="872" dy="17">required</tspan>
    </text>
  </g>
  <text class="pma-fc-caption" x="20" y="597">
    <tspan x="20" dy="0">After BMJ Core GRADE 4 (Guyatt et al., 2025) Figure 5. pmatools&#8217; operationalisation, not a reproduction:</tspan>
    <tspan x="20" dy="16">the dashed registry node is a pmatools input and is not in Figure 5.</tspan>
  </text>
</svg>

