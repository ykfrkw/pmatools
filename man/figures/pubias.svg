    <path d="M 553 80.5 L 560 76 L 553 71.5"/>
    <text class="pma-fc-edge-label" x="525" y="69" text-anchor="middle">No</text>
  </g>
  <g id="pma-pubias-edge-q0-yes" class="pma-fc-edge">
    <path d="M 255 104 L 255 150"/>
    <path d="M 250.5 143 L 255 150 L 259.5 143"/>
    <text class="pma-fc-edge-label" x="263" y="130" text-anchor="start">Yes</text>
  </g>
  <g id="pma-pubias-edge-q1-yes" class="pma-fc-edge">
    <path d="M 490 178 L 560 178"/>
    <path d="M 553 182.5 L 560 178 L 553 173.5"/>
    <text class="pma-fc-edge-label" x="525" y="171" text-anchor="middle">Yes</text>
  </g>
  <g id="pma-pubias-edge-q1-no" class="pma-fc-edge">
    <path d="M 255 206 L 255 252"/>
    <path d="M 250.5 245 L 255 252 L 259.5 245"/>
    <text class="pma-fc-edge-label" x="263" y="232" text-anchor="start">No</text>
  </g>
  <g id="pma-pubias-edge-registry-yes" class="pma-fc-edge">
    <path d="M 490 288 L 560 288"/>
    <path d="M 553 292.5 L 560 288 L 553 283.5"/>
    <text class="pma-fc-edge-label" x="525" y="281" text-anchor="middle">Yes</text>
  </g>
  <g id="pma-pubias-edge-registry-no" class="pma-fc-edge">
    <path d="M 255 325 L 255 377"/>
    <path d="M 250.5 370 L 255 377 L 259.5 370"/>
    <text class="pma-fc-edge-label" x="263" y="354" text-anchor="start">No or not answered</text>
  </g>
  <g id="pma-pubias-edge-q2-yes" class="pma-fc-edge">
    <path d="M 200 450 L 200 502"/>
    <path d="M 195.5 495 L 200 502 L 204.5 495"/>
    <text class="pma-fc-edge-label" x="208" y="479" text-anchor="start">Yes</text>
  </g>
  <g id="pma-pubias-edge-q2-no" class="pma-fc-edge">
    <path d="M 490 413 L 720 413 L 720 502"/>
    <path d="M 715.5 495 L 720 502 L 724.5 495"/>
    <text class="pma-fc-edge-label" x="500" y="405" text-anchor="start">No</text>
  </g>
  <g id="pma-pubias-edge-q3-yes" class="pma-fc-edge">
    <path d="M 164 592 L 164 622"/>
    <path d="M 159.5 615 L 164 622 L 168.5 615"/>
    <text class="pma-fc-edge-label" x="172" y="613" text-anchor="start">Yes</text>
  </g>
  <g id="pma-pubias-edge-q3-no" class="pma-fc-edge">
    <path d="M 316 592 L 316 622"/>
    <path d="M 311.5 615 L 316 622 L 320.5 615"/>
    <text class="pma-fc-edge-label" x="324" y="613" text-anchor="start">No</text>
  </g>
  <g id="pma-pubias-edge-q4-yes" class="pma-fc-edge">
    <path d="M 644 592 L 644 622"/>
    <path d="M 639.5 615 L 644 622 L 648.5 615"/>
    <text class="pma-fc-edge-label" x="652" y="613" text-anchor="start">Yes</text>
  </g>
  <g id="pma-pubias-edge-q4-no" class="pma-fc-edge">
    <path d="M 796 592 L 796 622"/>
    <path d="M 791.5 615 L 796 622 L 800.5 615"/>
    <text class="pma-fc-edge-label" x="804" y="613" text-anchor="start">No</text>
  </g>
  <g id="pma-pubias-node-q0" class="pma-fc-node">
    <rect x="20" y="48" width="470" height="56" rx="6" ry="6"/>
    <text x="255" y="71" text-anchor="middle">
      <tspan x="255" dy="0">Did the studies show an important effect?</tspan>
      <tspan x="255" dy="17">Computed from the pooled estimate and the threshold.</tspan>
    </text>
  </g>
  <g id="pma-pubias-leaf-nodown-q0" class="pma-fc-leaf">
    <rect x="560" y="48" width="380" height="39" rx="6" ry="6"/>
    <text x="750" y="71" text-anchor="middle">
      <tspan x="750" dy="0">Do not rate down</tspan>
    </text>
  </g>
  <g id="pma-pubias-node-q1" class="pma-fc-node">
    <rect x="20" y="150" width="470" height="56" rx="6" ry="6"/>
    <text x="255" y="173" text-anchor="middle">
      <tspan x="255" dy="0">Are most or all of the studies small</tspan>
      <tspan x="255" dy="17">and industry sponsored?</tspan>
    </text>
  </g>
  <g id="pma-pubias-leaf-down1-q1" class="pma-fc-leaf">
    <rect x="560" y="150" width="380" height="39" rx="6" ry="6"/>
    <text x="750" y="173" text-anchor="middle">
      <tspan x="750" dy="0">Rate down 1 level</tspan>
    </text>
  </g>
  <g id="pma-pubias-node-registry" class="pma-fc-node">
    <rect x="20" y="252" width="470" height="73" rx="6" ry="6"/>
    <text x="255" y="275" text-anchor="middle">
      <tspan x="255" dy="0">Is registry coverage complete, so that every</tspan>
      <tspan x="255" dy="17">registered trial can be accounted for?</tspan>
      <tspan x="255" dy="17">A pmatools input; the source has no such node.</tspan>
    </text>
  </g>
  <g id="pma-pubias-leaf-nodown-registry" class="pma-fc-leaf">
    <rect x="560" y="269" width="380" height="39" rx="6" ry="6"/>
    <text x="750" y="292" text-anchor="middle">
      <tspan x="750" dy="0">Do not rate down</tspan>
    </text>
  </g>
  <g id="pma-pubias-node-q2" class="pma-fc-node">
    <rect x="20" y="377" width="470" height="73" rx="6" ry="6"/>
    <text x="255" y="400" text-anchor="middle">
      <tspan x="255" dy="0">Are there enough studies (10 or more)</tspan>
      <tspan x="255" dy="17">to examine funnel plot asymmetry?</tspan>
      <tspan x="255" dy="17">Computed from the analysis, never asked.</tspan>
    </text>
  </g>
  <g id="pma-pubias-node-q3" class="pma-fc-node">
    <rect x="20" y="502" width="440" height="90" rx="6" ry="6"/>
    <text x="240" y="525" text-anchor="middle">
      <tspan x="240" dy="0">Does visual inspection of the funnel plot</tspan>
      <tspan x="240" dy="17">demonstrate substantial asymmetry, and/or</tspan>
      <tspan x="240" dy="17">is funnel plot asymmetry statistically</tspan>
      <tspan x="240" dy="17">significant (Egger&#8217;s test)?</tspan>
    </text>
  </g>
  <g id="pma-pubias-node-q4" class="pma-fc-node">
    <rect x="500" y="502" width="440" height="90" rx="6" ry="6"/>
    <text x="720" y="525" text-anchor="middle">
      <tspan x="720" dy="0">Did the review team discover and document</tspan>
      <tspan x="720" dy="17">unpublished studies of sufficient size to</tspan>
      <tspan x="720" dy="17">appreciably influence effect estimates</tspan>
      <tspan x="720" dy="17">(e.g., registry of FDA)?</tspan>
    </text>
  </g>
  <g id="pma-pubias-leaf-down1-q3" class="pma-fc-leaf">
    <rect x="94" y="622" width="140" height="56" rx="6" ry="6"/>
    <text x="164" y="645" text-anchor="middle">
      <tspan x="164" dy="0">Rate down</tspan>
      <tspan x="164" dy="17">1 level</tspan>
    </text>
  </g>
  <g id="pma-pubias-leaf-nodown-q3" class="pma-fc-leaf">
    <rect x="246" y="622" width="140" height="56" rx="6" ry="6"/>
    <text x="316" y="645" text-anchor="middle">
      <tspan x="316" dy="0">Do not</tspan>
      <tspan x="316" dy="17">rate down</tspan>
    </text>
  </g>
  <g id="pma-pubias-leaf-down1-q4" class="pma-fc-leaf">
    <rect x="574" y="622" width="140" height="56" rx="6" ry="6"/>
    <text x="644" y="645" text-anchor="middle">
      <tspan x="644" dy="0">Rate down</tspan>
      <tspan x="644" dy="17">1 level</tspan>
    </text>
  </g>
  <g id="pma-pubias-leaf-nodown-q4" class="pma-fc-leaf">
    <rect x="726" y="622" width="140" height="56" rx="6" ry="6"/>
    <text x="796" y="645" text-anchor="middle">
      <tspan x="796" dy="0">Do not</tspan>
      <tspan x="796" dy="17">rate down</tspan>
    </text>
  </g>
  <text class="pma-fc-caption" x="20" y="708">
    <tspan x="20" dy="0">After the Core GRADE Guide (Guyatt et al.) Figure 9-1, formerly Core GRADE 4 Figure 5. pmatools&#8217; operationalisation, not a reproduction:</tspan>
    <tspan x="20" dy="16">the registry node is a pmatools input and is not in the source; the important-effect and study-count nodes are computed, never asked;</tspan>
    <tspan x="20" dy="16">the p &lt; 0.05 cut-off for Egger&#8217;s test is pmatools&#8217;.</tspan>
  </text>
</svg>

