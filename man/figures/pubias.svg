<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="pubias-title pubias-desc">
  <title id="pubias-title">Publication bias: the Core GRADE Guide Figure 9-1 decision as pmatools implements it</title>
  <desc id="pubias-desc">Flowchart. The first question asks whether the studies showed an important effect; pmatools answers it from the pooled point estimate and the threshold the rating target uses, and no means do not rate down. Otherwise the next question asks whether most or all of the studies are small and industry sponsored; yes means rate down one level. Otherwise a pmatools input, labelled on the box itself because it is not a node of the source, asks whether registry coverage is complete; yes means do not rate down. Otherwise the chart asks whether there are enough studies, ten or more, to examine funnel plot asymmetry; pmatools counts the studies and answers that node itself. If there are, the next question asks whether visual inspection of the funnel plot demonstrates substantial asymmetry and/or the asymmetry is statistically significant by Egger&#8217;s test at p below 0.05: yes rates down one level, no does not, and a test that could not be run takes the same no as a default while the domain note asks for a qualitative assessment. If there are not, the chart asks instead whether the review team discovered and documented unpublished studies of sufficient size to appreciably influence effect estimates: yes rates down one level, and no, or no answer at all, does not. This is pmatools&#8217; operationalisation of the Core GRADE Guide Figure 9-1 decision (formerly Core GRADE 4 Figure 5), not a reproduction of the published figure.</desc>
  <style>
    .pma-fc-node rect, .pma-fc-leaf rect {
      fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2;
    }
    .pma-fc-edge path { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
    .pma-fc-node text, .pma-fc-leaf text, .pma-fc-edge text {
      fill: #475569; font-size: 13px; font-weight: 400;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
    }
    .pma-fc-edge-label { font-size: 12px; }
    .pma-fc-caption { fill: #64748b; font-size: 12px; font-style: italic;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif; }
    .pma-fc-heading { fill: #0f172a; font-size: 14px; font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif; }
    .pma-fc-on.pma-fc-node rect, .pma-fc-on.pma-fc-leaf rect {
      stroke: #0f172a; stroke-width: 2.5;
    }
    .pma-fc-on.pma-fc-edge path { stroke: #0f172a; stroke-width: 3; }
    .pma-fc-on text { fill: #0f172a; font-weight: 600; }
  </style>
  <text class="pma-fc-heading" x="20" y="26">Publication bias &#8212; Core GRADE Guide Fig 9-1, as pmatools implements it</text>
