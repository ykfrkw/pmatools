<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 684" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="rob-title rob-desc">
  <title id="rob-title">Risk of bias: the Core GRADE 4 Figure 2 decision as pmatools implements it</title>
  <desc id="rob-desc">Flowchart. Any study at high risk of bias? If no, do not rate down. If yes, do the high risk of bias studies dominate the evidence (55% or more of the pooled weight by default)? If they do, pmatools checks the direction of bias by comparing the pooled estimate with and without those studies and applying five mutually exclusive rules: both estimates trivial, or the same zone with a change within 10%, do not rate down; the same zone with a bias-favouring change over 10%, zones differing on the same side of the null, zones differing across the null, or a direction that cannot be assessed, rate down one level. If the high risk of bias studies do not dominate, pmatools asks whether there is appreciable evidence from the low risk of bias studies and, if so, whether the two magnitudes of effect are similar or substantially different; neither answer rates down, but a substantial difference restricts the analysis to the low risk of bias studies. This is pmatools&#8217; operationalisation of the Core GRADE 4 Figure 2 decision, not a reproduction of the published figure: the five rules are pmatools&#8217; and are not enumerated in the source.</desc>
  <style>
    .pma-fc-node rect, .pma-fc-leaf rect {
      fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2;
    }
    .pma-fc-pmatools rect { stroke-dasharray: 5 3; }
    .pma-fc-edge path { stroke: #cbd5e1; stroke-width: 1.5; fill: none; }
    .pma-fc-node text, .pma-fc-leaf text, .pma-fc-edge text {
      fill: #475569; font-size: 13px; font-weight: 400;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif;
    }
    .pma-fc-edge-label { font-size: 12px; }
    .pma-fc-caption { fill: #64748b; font-size: 12px; font-style: italic;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif; }
    .pma-fc-heading { fill: #0f172a; font-size: 14px; font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, sans-serif; }
    .pma-fc-on.pma-fc-node rect, .pma-fc-on.pma-fc-leaf rect {
      stroke: #0f172a; stroke-width: 2.5;
    }
    .pma-fc-on.pma-fc-edge path { stroke: #0f172a; stroke-width: 3; }
    .pma-fc-on text { fill: #0f172a; font-weight: 600; }
  </style>
  <text class="pma-fc-heading" x="20" y="26">Risk of bias &#8212; Core GRADE 4 Fig 2, as pmatools implements it</text>
  <g id="pma-rob-edge-anyhigh-no" class="pma-fc-edge">
    <path d="M 450 67 L 505 67"/>
    <path d="M 498 71.5 L 505 67 L 498 62.5"/>
    <text class="pma-fc-edge-label" x="477" y="60" text-anchor="middle">No</text>
  </g>
  <g id="pma-rob-edge-anyhigh-yes" class="pma-fc-edge">
    <path d="M 235 87 L 235 139"/>
    <path d="M 230.5 132 L 235 139 L 239.5 132"/>
    <text class="pma-fc-edge-label" x="243" y="116" text-anchor="start">Yes</text>
  </g>
  <g id="pma-rob-edge-dominance-yes" class="pma-fc-edge">
    <path d="M 235 212 L 235 264"/>
    <path d="M 230.5 257 L 235 264 L 239.5 257"/>
    <text class="pma-fc-edge-label" x="243" y="241" text-anchor="start">Yes</text>
  </g>
  <g id="pma-rob-edge-dominance-no" class="pma-fc-edge">
    <path d="M 450 175 L 722 175 L 722 264"/>
    <path d="M 717.5 257 L 722 264 L 726.5 257"/>
    <text class="pma-fc-edge-label" x="460" y="167" text-anchor="start">No</text>
  </g>
  <g id="pma-rob-edge-direction-rules" class="pma-fc-edge">
    <path d="M 235 337 L 235 369"/>
    <path d="M 230.5 362 L 235 369 L 239.5 362"/>
  </g>
  <g id="pma-rob-edge-appreciable-yes" class="pma-fc-edge">
    <path d="M 800 320 L 800 366"/>
    <path d="M 795.5 359 L 800 366 L 804.5 359"/>
    <text class="pma-fc-edge-label" x="808" y="346" text-anchor="start">Yes</text>
  </g>
  <g id="pma-rob-edge-appreciable-no" class="pma-fc-edge">
    <path d="M 560 320 L 560 474"/>
    <path d="M 555.5 467 L 560 474 L 564.5 467"/>
    <text class="pma-fc-edge-label" x="568" y="400" text-anchor="start">No</text>
  </g>
  <g id="pma-rob-edge-magnitude-similar" class="pma-fc-edge">
    <path d="M 660 422 L 660 474"/>
    <path d="M 655.5 467 L 660 474 L 664.5 467"/>
    <text class="pma-fc-edge-label" x="668" y="452" text-anchor="start">Similar</text>
  </g>
  <g id="pma-rob-edge-magnitude-different" class="pma-fc-edge">
    <path d="M 860 422 L 860 474"/>
    <path d="M 855.5 467 L 860 474 L 864.5 467"/>
    <text class="pma-fc-edge-label" x="868" y="452" text-anchor="start">Different</text>
  </g>
  <g id="pma-rob-node-anyhigh" class="pma-fc-node">
    <rect x="20" y="48" width="430" height="39" rx="6" ry="6"/>
    <text x="235" y="71" text-anchor="middle">
      <tspan x="235" dy="0">Any study at high risk of bias?</tspan>
    </text>
  </g>
  <g id="pma-rob-leaf-nohigh" class="pma-fc-leaf">
    <rect x="505" y="48" width="435" height="56" rx="6" ry="6"/>
    <text x="722.5" y="71" text-anchor="middle">
      <tspan x="722.5" dy="0">Do not rate down</tspan>
      <tspan x="722.5" dy="17">There is no high risk of bias study to check</tspan>
    </text>
  </g>
  <g id="pma-rob-node-dominance" class="pma-fc-node">
    <rect x="20" y="139" width="430" height="73" rx="6" ry="6"/>
    <text x="235" y="162" text-anchor="middle">
      <tspan x="235" dy="0">Do the high risk of bias studies</tspan>
      <tspan x="235" dy="17">dominate the evidence?</tspan>
      <tspan x="235" dy="17">weight share 55% or more, by default</tspan>
    </text>
  </g>
  <g id="pma-rob-node-direction" class="pma-fc-node">
    <rect x="20" y="264" width="430" height="73" rx="6" ry="6"/>
    <text x="235" y="287" text-anchor="middle">
      <tspan x="235" dy="0">Check the direction of bias</tspan>
      <tspan x="235" dy="17">Compare the pooled estimate with and without</tspan>
      <tspan x="235" dy="17">the high risk of bias studies</tspan>
    </text>
  </g>
  <g id="pma-rob-leaf-rule1" class="pma-fc-leaf">
    <rect x="35" y="369" width="400" height="39" rx="6" ry="6"/>
    <text x="47" y="392" text-anchor="start">
      <tspan x="47" dy="0">1  both estimates trivial  &#8594;  do not rate down</tspan>
    </text>
  </g>
  <g id="pma-rob-leaf-rule2" class="pma-fc-leaf">
    <rect x="35" y="414" width="400" height="39" rx="6" ry="6"/>
    <text x="47" y="437" text-anchor="start">
      <tspan x="47" dy="0">2  same zone, change within 10%  &#8594;  do not rate down</tspan>
    </text>
  </g>
  <g id="pma-rob-leaf-rule3" class="pma-fc-leaf">
    <rect x="35" y="459" width="400" height="39" rx="6" ry="6"/>
    <text x="47" y="482" text-anchor="start">
      <tspan x="47" dy="0">3  same zone, bias-favouring change over 10%  &#8594;  rate down 1</tspan>
    </text>
  </g>
  <g id="pma-rob-leaf-rule4" class="pma-fc-leaf">
    <rect x="35" y="504" width="400" height="39" rx="6" ry="6"/>
    <text x="47" y="527" text-anchor="start">
      <tspan x="47" dy="0">4  zones differ, same side of the null  &#8594;  rate down 1</tspan>
    </text>
  </g>
  <g id="pma-rob-leaf-rule5" class="pma-fc-leaf">
    <rect x="35" y="549" width="400" height="39" rx="6" ry="6"/>
    <text x="47" y="572" text-anchor="start">
      <tspan x="47" dy="0">5  zones differ across the null  &#8594;  rate down 1</tspan>
    </text>
  </g>
  <g id="pma-rob-leaf-rulena" class="pma-fc-leaf">
    <rect x="35" y="594" width="400" height="39" rx="6" ry="6"/>
    <text x="47" y="617" text-anchor="start">
      <tspan x="47" dy="0">&#8211;  direction not assessable  &#8594;  rate down 1</tspan>
    </text>
  </g>
  <g id="pma-rob-node-appreciable" class="pma-fc-node">
    <rect x="505" y="264" width="435" height="56" rx="6" ry="6"/>
    <text x="722.5" y="287" text-anchor="middle">
      <tspan x="722.5" dy="0">Is there appreciable evidence from</tspan>
      <tspan x="722.5" dy="17">the low risk of bias studies?</tspan>
    </text>
  </g>
  <g id="pma-rob-node-magnitude" class="pma-fc-node">
    <rect x="620" y="366" width="320" height="56" rx="6" ry="6"/>
    <text x="780" y="389" text-anchor="middle">
      <tspan x="780" dy="0">Similar or substantially different</tspan>
      <tspan x="780" dy="17">magnitudes of effect?</tspan>
    </text>
  </g>
  <g id="pma-rob-leaf-all" class="pma-fc-leaf">
    <rect x="505" y="474" width="200" height="56" rx="6" ry="6"/>
    <text x="605" y="497" text-anchor="middle">
      <tspan x="605" dy="0">Do not rate down</tspan>
      <tspan x="605" dy="17">Analyse all studies</tspan>
    </text>
  </g>
  <g id="pma-rob-leaf-lowonly" class="pma-fc-leaf">
    <rect x="725" y="474" width="215" height="56" rx="6" ry="6"/>
    <text x="832.5" y="497" text-anchor="middle">
      <tspan x="832.5" dy="0">Do not rate down</tspan>
      <tspan x="832.5" dy="17">Analyse low risk studies</tspan>
    </text>
  </g>
  <text class="pma-fc-caption" x="20" y="654">
    <tspan x="20" dy="0">After BMJ Core GRADE 4 (Guyatt et al., 2025) Figure 2. pmatools&#8217; operationalisation, not a reproduction:</tspan>
    <tspan x="20" dy="16">the five direction-of-bias rules are pmatools&#8217; own.</tspan>
  </text>
</svg>

