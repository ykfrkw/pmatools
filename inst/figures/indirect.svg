<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 746" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="indirect-title indirect-desc">
  <title id="indirect-title">Indirectness: the Core GRADE Guide Figure 8-2 decision as pmatools implements it</title>
  <desc id="indirect-desc">Flowchart. The question of interest is compared with the PICO of the available studies along four parallel branches. Population, Intervention and Comparator each ask whether there are differences versus the target - in age, condition or disease, or the population over time; in dose, duration, route, operator skill, non-adherence, switching or changing technology; in the comparator&#8217;s dose, duration, route or quality of administration. No means do not rate down. Yes leads to a shared question: are the biological or social factors sufficiently similar that one would anticipate a similar impact on the target outcome? Yes means do not rate down; no, dissimilar, means rate down once; no, very dissimilar, means rate down twice. The Outcome branch asks whether the outcome is a surrogate of the outcome of interest. If it is, how far is the surrogate placed in the putative causal pathway from the patient-important endpoints? Very close means do not rate down (some surrogates are so directly linked to the disease process that they always represent a patient-important outcome), close means rate down once, and far means rate down twice. If it is not a surrogate, are the criteria used to define outcomes and the time frames for measurement similar to the target? Yes means do not rate down; no means rate down once. This is pmatools&#8217; operationalisation of the living Core GRADE Guide Figure 8-2, not a reproduction of the published figure: the figure does not say how its four branches combine, and pmatools takes the worst case across them; and answers on pmatools&#8217; legacy four-point scale (yes, probably yes, probably no, no) are drawn on the Population, Intervention and Comparison routes as no difference, similar, dissimilar and very dissimilar, while on the Outcome branch they determine no route beyond the surrogate question.</desc>
