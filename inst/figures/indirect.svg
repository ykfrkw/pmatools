  <text class="pma-fc-caption" x="20" y="650">
    <tspan x="20" dy="0">* Very close: some surrogates are so directly linked to the disease process that they always represent a</tspan>
    <tspan x="20" dy="16">patient-important outcome (for example, a hip fracture diagnosed on radiograph).</tspan>
  </text>
  <text class="pma-fc-caption" x="20" y="694">
    <tspan x="20" dy="0">After the living Core GRADE Guide (2025-2026), chapter 8, Fig 8-2. pmatools&#8217; operationalisation, not a reproduction:</tspan>
    <tspan x="20" dy="16">pmatools combines the four branches worst-case, which the figure does not specify, and draws answers on its</tspan>
    <tspan x="20" dy="16">pre-Fig-8-2 legacy scale on the Population / Intervention / Comparison routes; on Outcome they stop at the first question.</tspan>
  </text>
